<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVE TESTER</title>
    <style>
        body {
            background: linear-gradient(45deg, #ff66cc, #ff99ff, #ff3399);
            font-family: 'Comic Sans MS', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: #fff0f5;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 20px #ff00ff, 0 0 40px #ff69b4;
            text-align: center;
            border: 5px solid #ff1493;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        h1 {
            color: #ff1493;
            font-size: 50px;
            text-shadow: 3px 3px #ffff00, 6px 6px #ff69b4;
            margin-bottom: 20px;
        }

        input {
            padding: 15px;
            margin: 10px;
            border: 3px solid #ff69b4;
            border-radius: 15px;
            font-size: 20px;
            background: #ffe6f2;
            color: #ff1493;
            width: 200px;
            outline: none;
        }

        input::placeholder {
            color: #ff69b4;
        }

        button {
            padding: 15px 30px;
            background: #ff00ff;
            border: 3px solid #ffff00;
            border-radius: 20px;
            color: white;
            font-size: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #ffff00;
            color: #ff00ff;
            transform: scale(1.1);
            box-shadow: 0 0 15px #ff00ff;
        }

        #result {
            margin-top: 20px;
            font-size: 30px;
            color: #ff1493;
            text-shadow: 2px 2px #ffff00;
            display: none;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        .hearts {
            position: absolute;
            width: 50px;
            height: 50px;
            color: #ff1493;
            font-size: 40px;
            animation: float 5s infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh); opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💖 LOVE TESTER 💖</h1>
        <input type="text" id="name1" placeholder="First Name">
        <input type="text" id="name2" placeholder="Second Name">
        <br>
        <button onclick="calculateLove()">TEST LOVE!</button>
        <div id="result"></div>
    </div>

    <script>
        function calculateLove() {
            const name1 = document.getElementById('name1').value.trim();
            const name2 = document.getElementById('name2').value.trim();
            const resultDiv = document.getElementById('result');

            if (name1 === '' || name2 === '') {
                resultDiv.textContent = 'Please enter both names! 💔';
                resultDiv.style.display = 'block';
                return;
            }

            const loveScore = Math.floor(Math.random() * 101);
            resultDiv.textContent = `${name1} & ${name2}: ${loveScore}% LOVE! 💕`;
            resultDiv.style.display = 'block';

            // Add floating hearts
            for (let i = 0; i < 10; i++) {
                const heart = document.createElement('div');
                heart.textContent = '💖';
                heart.className = 'hearts';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 5000);
            }
        }

        // Clear inputs on page load
        window.onload = () => {
            document.getElementById('name1').value = '';
            document.getElementById('name2').value = '';
        };
    </script>
</body>
</html>
