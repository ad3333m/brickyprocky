<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}</style>
</head>
<body>
<title>Five Day at Freddys</title>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
"autoplay": "off",
"polyfills": true,
"letterbox": "on",
"backgroundColor": null,
"scale": "showAll",
"allowFullscreen": true,
"forceScale": true,
"forceAlign": true,
"splashScreen": true,
"wmode": "Window",
"unmuteOverlay": "hidden",
"quality": "high" };
window.addEventListener("load", (event) => {
const ruffle = window.RufflePlayer.newest();
const player = ruffle.createPlayer();
const container = document.getElementById("container");
container.appendChild(player);
player.load("https://cdn.jsdelivr.net/gh/AlbertKraus/open-source-v3@e6a33f1e3745d0d71792d2a10b4cdbe3e8462308/template/five.project");
player.style.width = "100%";
player.style.height = "100%";
});
</script>
<div id="container">
</div>
</body>
</html>
