<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G+ | Unblocked Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f0e17;
      --bg-card: #1a1930;
      --bg-card-hover: #252347;
      --accent-1: #ff6b6b;
      --accent-2: #ffd93d;
      --accent-3: #6bcb77;
      --accent-4: #4d96ff;
      --accent-5: #c77dff;
      --text-primary: #fffffe;
      --text-muted: #a7a9be;
      --glow-1: rgba(255, 107, 107, 0.3);
      --glow-2: rgba(77, 150, 255, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-primary);
      font-family: 'Quicksand', sans-serif;
      color: var(--text-primary);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* === ANIMATED BG BLOBS === */
    .bg-blobs {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none; overflow: hidden;
    }
    .blob {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.12;
      animation: blobFloat 18s ease-in-out infinite alternate;
    }
    .blob-1 { width: 400px; height: 400px; background: var(--accent-1); top: -10%; left: -5%; animation-delay: 0s; }
    .blob-2 { width: 350px; height: 350px; background: var(--accent-4); top: 50%; right: -8%; animation-delay: -6s; }
    .blob-3 { width: 300px; height: 300px; background: var(--accent-5); bottom: -5%; left: 30%; animation-delay: -12s; }

    @keyframes blobFloat {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
      100% { transform: translate(10px, -10px) scale(1.05); }
    }

    .top-bar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15, 14, 23, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 10px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .logo {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700; font-size: 22px;
      display: flex; align-items: center; gap: 8px;
      user-select: none;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 2px 12px var(--glow-1);
    }
    .logo span:nth-child(2) { color: var(--accent-2); }
    .logo span:nth-child(3) { color: var(--text-primary); }

    .search-box {
      display: flex; align-items: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 6px 14px;
      max-width: 260px; width: 100%;
    }
    .search-box input {
      background: none; border: none; outline: none;
      color: var(--text-primary);
      font-size: 13px; width: 100%;
      margin-left: 6px;
    }

    .nav-pills { display: flex; gap: 6px; }
    .pill {
      padding: 5px 14px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      color: var(--text-muted);
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
    }
    .pill:hover, .pill.active {
      background: linear-gradient(135deg, var(--accent-4), var(--accent-5));
      color: #fff;
    }

    .main-wrap {
      position: relative; z-index: 1;
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
    }

    .player-section { display: flex; flex-direction: column; gap: 12px; }

    .player-frame {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .player-frame iframe {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; border: 0;
    }

    .sidebar {
      background: var(--bg-card);
      border-radius: 16px;
      max-height: calc(100vh - 100px);
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 14px 16px;
      font-weight: 700;
      color: var(--accent-2);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .sidebar-list {
      overflow-y: auto;
      padding: 6px;
    }
    .side-card {
      display: flex; gap: 10px; padding: 8px; border-radius: 10px; cursor: pointer;
    }
    .side-card:hover { background: var(--bg-card-hover); }
    .side-thumb { width: 120px; border-radius: 8px; aspect-ratio: 16/9; object-fit: cover; }
    .side-title { font-size: 12.5px; font-weight: 700; line-height: 1.3; }

    .explore-section { padding: 40px 16px; max-width: 1280px; margin: 0 auto; }
    .explore-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .vid-card { background: var(--bg-card); border-radius: 14px; overflow: hidden; cursor: pointer; }
    .vid-card-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    .vid-card-info { padding: 10px; }
    .vid-card-title { font-size: 13.5px; font-weight: 700; }

    .now-playing-info { background: var(--bg-card); padding: 15px; border-radius: 12px; }
    
    @media (max-width: 860px) {
      .main-wrap { grid-template-columns: 1fr; }
      .nav-pills { display: none; }
    }
  </style>
</head>
<body>

  <div class="bg-blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>

  <div class="top-bar">
    <div class="logo">
      <div class="logo-icon">&#9654;</div>
      <span>Play</span><span>G+</span>
    </div>
    <div class="nav-pills">
      <div class="pill active" data-cat="all">All</div>
      <div class="pill" data-cat="roblox">Roblox</div>
      <div class="pill" data-cat="minecraft">Minecraft</div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search unblocked content..." />
    </div>
  </div>

  <div class="main-wrap">
    <div class="player-section">
      <div class="player-frame" id="playerFrame"></div>
      <div class="now-playing-info" id="nowPlaying">
        <div class="now-playing-title" id="npTitle">Select a video</div>
        <div class="now-playing-channel" id="npChannel" style="color: var(--accent-4); font-size: 13px;"></div>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-header">&#9889; Up Next</div>
      <div class="sidebar-list" id="sidebarList"></div>
    </div>
  </div>

  <div class="explore-section">
    <h2 style="margin-bottom: 20px; font-family: 'Fredoka';">🎮 Gaming Feed</h2>
    <div class="explore-grid" id="exploreGrid"></div>
  </div>

  <script>
    const FEED_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQI-2V5YW4mgXqO2ZXRbQfmpkrSgpLug3J9RJVWpi_6ODID8246bvMckEDy1R_hc8XVPHglrKPGrrVD/pub?output=csv";
    
    // GÜNCEL BYPASS AYARLARI
    const ORIGINS = [
      "https://create.kahoot.it",
      "https://classroom.google.com",
      "https://quizizz.com"
    ];

    let videos = [];

    async function boot() {
      try {
        const res = await fetch(FEED_URL);
        const data = await res.text();
        const rows = data.split('\n').slice(1);

        videos = rows.map(row => {
          const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); // Advanced CSV split
          return {
            title: cols[0]?.replace(/"/g, ''),
            id: cols[1]?.trim(),
            thumb: cols[2]?.trim(),
            channel: cols[3]?.replace(/"/g, '')
          };
        }).filter(v => v.id);

        renderSidebar(videos);
        renderExplore(videos);
        if(videos.length > 0) playVideo(videos[0]);
      } catch (e) {
        console.error("Feed error", e);
      }
    }

    function playVideo(video) {
      const frame = document.getElementById('playerFrame');
      
      // OPTİME EDİLMİŞ BYPASS URL YAPISI
      // 1. youtube-nocookie kullanıyoruz (Filtreler daha az şüphelenir)
      // 2. enablejsapi=1 ekliyoruz
      // 3. Kahoot origin'ini kullanarak "eğitim içeriği" süsü veriyoruz
      const bypassUrl = `https://www.youtube-nocookie.com/embed/${video.id}?` + 
        `autoplay=1&` +
        `controls=1&` +
        `rel=0&` +
        `modestbranding=1&` +
        `enablejsapi=1&` +
        `origin=${encodeURIComponent(ORIGINS[0])}&` +
        `widget_referrer=${encodeURIComponent(ORIGINS[0])}`;

      frame.innerHTML = `<iframe 
        src="${bypassUrl}" 
        allow="autoplay; encrypted-media; fullscreen" 
        allowfullscreen></iframe>`;

      document.getElementById('npTitle').textContent = video.title;
      document.getElementById('npChannel').textContent = video.channel;
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function renderSidebar(list) {
      const container = document.getElementById('sidebarList');
      container.innerHTML = list.map(v => `
        <div class="side-card" onclick="playVideoById('${v.id}')">
          <img src="${v.thumb}" class="side-thumb">
          <div class="side-meta">
            <div class="side-title">${v.title}</div>
          </div>
        </div>
      `).join('');
    }

    function renderExplore(list) {
      const container = document.getElementById('exploreGrid');
      container.innerHTML = list.map(v => `
        <div class="vid-card" onclick="playVideoById('${v.id}')">
          <img src="${v.thumb}" class="vid-card-thumb">
          <div class="vid-card-info">
            <div class="vid-card-title">${v.title}</div>
            <div style="font-size:12px; color:var(--accent-3); margin-top:5px;">${v.channel}</div>
          </div>
        </div>
      `).join('');
    }

    window.playVideoById = (id) => {
      const v = videos.find(x => x.id === id);
      if(v) playVideo(v);
    };

    boot();
  </script>
</body>
</html>
